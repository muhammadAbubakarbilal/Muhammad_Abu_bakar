<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     role="img"
     aria-label="AB Monogram Favicon – White">
  <!--
    AB MONOGRAM – WHITE FAVICON
    High visibility white version
    Optimized for browser tabs
    Bold simplified forms for 16×16 clarity
  -->

  <!-- Solid dark circle background for maximum contrast -->
  <circle cx="32" cy="32" r="30" fill="#0A0A0A"/>

  <!-- White bold AB monogram -->
  <g fill="#FFFFFF">

    <!-- Letter A -->
    <path d="M 13 49
             L 26.5 15
             L 32.5 15
             L 21.5 49 Z"/>
    <path d="M 32.5 15
             L 38.5 15
             L 49 49
             L 42 49 Z"/>
    <!-- Thick crossbar -->
    <rect x="21.5" y="33" width="19" height="5.8" rx="0.6"/>

    <!-- Letter B -->
    <!-- Stem -->
    <path d="M 34 15 H 41 V 49 H 34 Z"/>

    <!-- Upper bowl -->
    <path d="M 41 15
             C 52.5 15, 56 20.5, 56 26.5
             C 56 32, 51.5 35, 43 35
             H 41 Z"/>

    <!-- Lower bowl -->
    <path d="M 41 35
             C 53.5 35, 57.5 40, 57.5 46
             C 57.5 50.5, 52 49, 43 49
             H 41 Z"/>
  </g>
</svg>
